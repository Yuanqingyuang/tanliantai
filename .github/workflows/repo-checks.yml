name: repo-checks

# 触发：向 main 分支推送或对 main 发起 PR
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 只读权限即可：本工作流不写回仓库
permissions:
  contents: read

# 同一分支上的重复运行自动取消，节省额度
concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: 结构与文档级检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 技术栈【待确认】，因此只做结构与文档级检查：不编译、不安装依赖、不执行单元测试
      - name: 校验仓库目录结构
        run: python tools/check_repo_structure.py

      # 环境自检在 CI 上可能因容器专用条件失败，不阻塞，但必须打印输出
      - name: 环境自检（失败不阻塞）
        run: python environment/scripts/check_environment.py || true
